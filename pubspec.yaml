name: noworry_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  font_awesome_flutter: ^10.7.0
  intl_phone_field: ^3.2.0
  dotted_border: ^2.1.0 # Pour la bordure en pointillés
  file_picker: ^8.0.0
  
  dio: ^5.0.0
  provider: ^6.1.1

  flutter_localizations:
    sdk: flutter
  
  # Assurez-vous d'avoir ce package pour la logique de traduction
  intl: ^0.19.0 

  cupertino_icons: ^1.0.6 # Mise à jour vers une version stable
  
  iconsax: any

  google_fonts: ^6.2.1 # Version stable
 # image_picker: ^1.1.0
  #file_picker: ^6.2.1 # Ajout d'une version spécifique

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0 # Version stable

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/img1.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/img1.png"


flutter:
  generate: true
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/static/Montserrat-Regular.ttf 
          weight: 400
       
        - asset: assets/fonts/Montserrat/static/Montserrat-Medium.ttf
          weight: 500

        - asset: assets/fonts/Montserrat/static/Montserrat-SemiBold.ttf
          weight: 300
          
        - asset: assets/fonts/Montserrat/static/Montserrat-Bold.ttf
          weight: 800  

  uses-material-design: true

  assets:
    - assets/images/